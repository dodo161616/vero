    var root = document.getElementById('root');

    var root = document.getElementById('root');

  html, body { background:#0A0B0D; }
  * { -webkit-tap-highlight-color: transparent; }
  body { font-family: 'Inter', sans-serif; }
  ::-webkit-scrollbar { display:none; }
  .no-scrollbar::-webkit-scrollbar { display:none; }
  .safe-bottom { padding-bottom: env(safe-area-inset-bottom); }

  .video-surface {
    position: relative;
    overflow: hidden;
    background-size: 200% 200%;
    animation: drift 14s ease-in-out infinite;
  }
  @keyframes drift { 0%{background-position:0% 0%;} 50%{background-position:100% 100%;} 100%{background-position:0% 0%;} }
  @keyframes growbar { from{width:0%;} to{width:100%;} }
  .video-surface::after {
    content:'';
    position:absolute; inset:0;
    background-image: radial-gradient(circle at 30% 20%, rgba(255,255,255,0.10), transparent 40%);
  }
  .play-chip {
    backdrop-filter: blur(6px);
    background: rgba(10,11,13,0.45);
    border: 1px solid rgba(255,255,255,0.18);
  }

  .ticket {
    position: relative;
    background: #16181F;
    border: 1px solid #262A33;
  }
  .ticket::before, .ticket::after {
    content:'';
    position:absolute;
    width:18px; height:18px;
    background:#0A0B0D;
    border:1px solid #262A33;
    border-radius:50%;
    top:50%;
    transform: translateY(-50%);
  }
  .ticket::before { left:-10px; }
  .ticket::after { right:-10px; }
  .ticket-perf {
    background-image: repeating-linear-gradient(to right, #2E323C 0, #2E323C 6px, transparent 6px, transparent 12px);
    height:1px;
  }

  .fade-in { animation: fadeIn .35s ease both; }
  @keyframes fadeIn { from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }

  .tap { transition: transform .12s ease, opacity .12s ease; }
  .tap:active { transform: scale(0.97); opacity:0.9; }

  input[type="date"]::-webkit-calendar-picker-indicator, input[type="time"]::-webkit-calendar-picker-indicator { filter: invert(0.8); }
</style>

n:"Pavilion opened in 2018 in a 19th-century Tbilisi courtyard that once housed a silk merchant. The founder, Tamara Beridze, spent three years sourcing forgotten Georgian grain varieties before opening the kitchen. The wine cellar \u2014 400 bottles deep \u2014 is built into the original limestone foundation.","bosphorus-terrace":"Built on the site of an Ottoman-era fish market, Bosphorus Terrace has been serving on the waterfront since 2011. The current chef took over in 2019 and introduced the tasting menu format while preserving the \xE0 la carte classics the neighbourhood grew up on.","caspian-flame":"Named after Azerbaijan's eternal flame, the restaurant was founded by the Mammadov family in 2015. The patriarch learned to cook from his grandmother's handwritten notebooks \u2014 recipes that predate the Soviet era. The plov is made once per day and sells out by 21:00.","seaside-grill":"A Batumi institution since 1997. The owners were among the first to convert the Soviet-era promenade space into a dining terrace. The fish is sourced daily from Black Sea boats that dock 200 metres from the kitchen.","khinkali-house":"Hand-folded khinkali by weight since 1998. The Asatiani family recipe uses a resting dough technique not taught in culinary schools \u2014 it has been passed from grandmother to kitchen for three generations.","karakoy-balik":"The dockside fish sandwich has been an Istanbul ritual since 1962. The current owner, Mehmet Y\u0131ld\u0131z, is the grandson of the founder. The mackerel is grilled on a charcoal rig that has never been replaced \u2014 only repaired.","icheri-teahouse":"Situated inside Baku's Walled City \u2014 a UNESCO World Heritage Site \u2014 the teahouse has operated in the same building since 1978. The samovar is original. The backgammon boards are replaced every decade.","rustaveli-grand":"Rustaveli Grand opened in a 1905 Art Nouveau building that once hosted the Tbilisi Opera's cast parties. Chef Nino Kalandadze trained in Copenhagen before returning to Georgia with a mission to document and modernise every regional recipe before the older generation takes them to the grave.","black-sea-wave":"The Wave was built on stilts by a retired fisherman in 2009. What started as a single table for his family became one of the most-booked terraces on the Black Sea coast. The fish is delivered by the same four boats every morning at 06:00.","palace-kitchen":"The han building dates to 1641 and once served merchants of the Grand Bazaar. The current kitchen team has spent eight years studying palace manuscripts to reconstruct dishes that disappeared after the fall of the Ottoman Empire. Every recipe is documented and dated.","baku-garden":"The Aliyev family grows their own produce in the village of Guba, 170km north of Baku, and drives it to the restaurant every Monday and Thursday. The garden terrace was carved into the Upland Park hillside by the owner's father, who was a landscape architect.","wine-house-tbilisi":"The cellar runs three floors underground into the original 1880s foundation of a Vera district merchant house. Sommelier Giorgi Makharadze maintains 80 Georgian natural wines by the glass \u2014 every label from a producer he has personally visited."},Lb={pavilion:["Best New Restaurant, Georgia 2019","Wine List of the Year 2022","Vero Trust Score Champion 2024","Vero Signature 2023\u20132024"],"bosphorus-terrace":["Best Restaurant Istanbul 2023","Vero Icon 2024","World's Best Terrace Dining 2023","Most Reservations on Vero 2024"],"palace-kitchen":["Best Heritage Kitchen, Turkey 2023","Vero Icon 2024","Ottoman Culinary Preservation Award 2022"],"rustaveli-grand":["Best Fine Dining, Caucasus 2024","Vero Signature 2024","Best Wine List, Georgia 2023"],"caspian-flame":["Best Azerbaijani Cuisine 2023","Vero Premium 2023","Heritage Kitchen Award 2022"],"seaside-grill":["Best Seafood, Black Sea 2022","Vero Certified 2023","Batumi Restaurant of the Year 2021"],"black-sea-wave":["Black Sea Seafood Award 2
